name: Build desktop Windows
run-name: Desktop Windows ${{ inputs.version }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versione del pacchetto (es. 1.0.1)
        required: true
        type: string
      request_id:
        description: Identificatore della richiesta Linux
        required: true
        type: string

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepara WiX
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Recurse -Filter candle.exe -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installazione WiX fallita.' }
            $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*' -Recurse -Filter candle.exe -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if (-not $wix) { throw 'candle.exe non trovato.' }
          $wix.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Crea installer
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: .\deploy-desktop-windows.ps1 -AppVersion $env:APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: fisio-desktop-windows-${{ inputs.version }}
          path: fisio-desktop/target/windows-dist/${{ inputs.version }}/
          if-no-files-found: error
          retention-days: 14
