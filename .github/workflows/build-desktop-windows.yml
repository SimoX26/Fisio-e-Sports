name: Build desktop Windows
run-name: Desktop Windows ${{ inputs.version }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versione del pacchetto (es. 1.0.1)
        required: true
        type: string
      request_id:
        description: Identificatore della richiesta Linux
        required: true
        type: string

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepara WiX
        shell: pwsh
        run: |
          function Find-Wix {
            $roots = @()
            $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
            if (Test-Path -LiteralPath $programFilesX86) {
              $roots += @(Get-ChildItem -LiteralPath $programFilesX86 -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like 'WiX Toolset*' })
            }
            $chocoPackage = Join-Path $env:ProgramData 'chocolatey\lib\wixtoolset'
            if (Test-Path -LiteralPath $chocoPackage) { $roots += Get-Item -LiteralPath $chocoPackage }
            foreach ($root in $roots) {
              $found = Get-ChildItem -LiteralPath $root.FullName -Recurse -Filter candle.exe -File -ErrorAction SilentlyContinue |
                Where-Object { Test-Path -LiteralPath (Join-Path $_.DirectoryName 'light.exe') } |
                Select-Object -First 1
              if ($found) { return $found.DirectoryName }
            }
            $command = Get-Command candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($command -and (Test-Path -LiteralPath (Join-Path (Split-Path $command.Source) 'light.exe'))) {
              return (Split-Path $command.Source)
            }
            return $null
          }
          $wixDirectory = Find-Wix
          if (-not $wixDirectory) {
            choco install wixtoolset -y --force --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installazione WiX fallita.' }
            $wixDirectory = Find-Wix
          }
          if (-not $wixDirectory) { throw 'candle.exe e light.exe non trovati dopo la reinstallazione di WiX.' }
          Write-Host "WiX disponibile in: $wixDirectory"
          $wixDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Crea installer
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: .\deploy-desktop-windows.ps1 -AppVersion $env:APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: fisio-desktop-windows-${{ inputs.version }}
          path: fisio-desktop/target/windows-dist/${{ inputs.version }}/
          if-no-files-found: error
          retention-days: 14
